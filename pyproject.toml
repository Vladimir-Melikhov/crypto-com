[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
# Ложные срабатывания на кириллицу в комментариях и docstring
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Иначе isort принимает пакет alembic за локальную папку alembic/
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
